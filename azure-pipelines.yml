trigger:
  branches:
    include:
    - main

stages:
- stage: __default
  jobs:
  - job: Job
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: Use Python 3.11

    - script: python -m pip install --upgrade pip
      displayName: Upgrade pip

    - script: python -m pip install -r requirements.txt
      displayName: Install Python packages

    - task: CmdLine@2
      displayName: pytest
      env:
        ADMIN_USERNAME: $(ADMIN_USERNAME)
        ADMIN_PASSWORD: $(ADMIN_PASSWORD)
        CBO_USERNAME: $(CBO_USERNAME)
        CBO_PASSWORD: $(CBO_PASSWORD)
        ENGINEER_USERNAME: $(ENGINEER_USERNAME)
        ENGINEER_PASSWORD: $(ENGINEER_PASSWORD)
        BASE_URL: $(BASE_URL)
        API_BASE_URL: $(API_BASE_URL)
        BROWSER: $(BROWSER)
        HEADLESS: $(HEADLESS)
        MOCK_HARDWARE: $(MOCK_HARDWARE)
        FIRMWARE_FILE_PATH: $(FIRMWARE_FILE_PATH)
        CI: "true"
      inputs:
        script: python -m pytest tests --browser=chrome --headless=true